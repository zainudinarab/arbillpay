# ==============================================================================
# DOCKER COMPOSE - ARBILL BILLING SAAS
# ==============================================================================
# Seluruh variabel rahasia (Database Password, Redis Password, Token API WhatsApp,
# dsb) otomatis dimuat secara aman dari file .env di host tanpa terekspos ke image.
# ==============================================================================

services:
  arbill:
    image: ghcr.io/zainudinarab/arbillpay:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbill-app
    restart: unless-stopped
    ports:
      # Port 3006 sesuai target Cloudflare Tunnel (http://localhost:3006)
      - "3006:3006"
    volumes:
      # Mount folder public: Perubahan myqr, gambar, dan aset statis langsung aktif seketika tanpa perlu build ulang Docker
      - ./public:/app/public
      # Mount dist & server: Memungkinkan update kilat (< 1 detik) via 'docker compose restart arbill' setelah git pull
      - ./dist:/app/dist
      - ./server:/app/server
      - ./server.ts:/app/server.ts
    # Memuat seluruh kredensial & variabel rahasia dari file .env
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3006
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - app_shared_net

networks:
  app_shared_net:
    external: true
